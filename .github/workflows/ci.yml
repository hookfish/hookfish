name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            .turbo/cache
            examples/backends/nextjs/.next/cache
          key: ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - name: Build affected packages
        run: pnpm exec turbo run build --affected

      # The build scripts already run TypeScript for every workspace except the
      # inspector, whose Vite build only transpiles source files. Run through
      # Turbo so the inspector's workspace dependencies are built first.
      - name: Typecheck inspector
        run: pnpm exec turbo run typecheck --filter=@hookfish/inspector

      - name: Load the published packages under plain Node
        run: pnpm exec turbo run verify-runtime --filter=@hookfish/example-hono-node

      - name: Validate generated Cloudflare types
        run: pnpm exec turbo run cf-typecheck --affected

      - name: Test affected packages
        run: pnpm exec turbo run test --affected
